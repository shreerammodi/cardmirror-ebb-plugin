name: Release

on:
    push:
        tags:
            - "v*"

# The installer downloads the two release assets, so the job must be able
# to create the release.
permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - uses: softprops/action-gh-release@v2
              with:
                  files: |
                      cardmirror-plugin.json
                      plugin.js
